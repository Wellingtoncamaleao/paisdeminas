<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.html index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # HTML sempre fresh — Cache-Control no-cache
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </FilesMatch>

    # Assets versionados — cache 1 dia (URL muda no deploy via ?v=BUILD_ID)
    <FilesMatch "\.(js|css|png|jpg|jpeg|svg|gif|ico)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>

    # API nunca cacheia
    <Directory /var/www/html/api>
        <Files "*.php">
            Header set Cache-Control "no-store"
        </Files>
    </Directory>

    # Compactacao
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json text/plain
    </IfModule>

    # Headers de seguranca basicos
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "no-referrer-when-downgrade"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
